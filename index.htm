<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة حسن نصير</title>
    <style>
        /* إعدادات الخلفية */
        body { 
            background-color: #0f172a; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            color: #fff;
        }

        /* تصميم البطاقة الرئيسي */
        .card { 
            background: #1e293b; 
            padding: 35px; 
            border-radius: 25px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
            text-align: center; 
            width: 320px; 
            border-top: 6px solid #38bdf8;
            animation: slideUp 0.8s ease-out;
        }

        h1 { color: #38bdf8; font-size: 26px; margin-bottom: 25px; }

        /* صفوف المعلومات */
        .info-box { 
            background: #334155; 
            margin: 12px 0; 
            padding: 15px; 
            border-radius: 15px; 
            text-align: right; 
            transition: 0.3s;
        }

        .info-box:hover { 
            background: #38bdf8; 
            color: #0f172a; 
            transform: scale(1.05); 
        }

        .label { font-weight: bold; margin-left: 5px; }

        /* حركة الدخول */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer { font-size: 11px; color: #94a3b8; margin-top: 25px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>البطاقة التعريفية 💳</h1>
        
        <div class="info-box">
            <span class="label">👤 الاسم:</span> حسن نصير
        </div>
        
        <div class="info-box">
            <span class="label">🏫 الصف:</span> الرابع العلمي
        </div>
        
        <div class="info-box">
            <span class="label">📍 الموقع:</span> العراق - النجف
        </div>

        <div class="footer">صُمم بواسطة هاتف TECNO CAMON 18P 📱</div>
    </div>
</body>
</html>
